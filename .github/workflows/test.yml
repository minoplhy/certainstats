name: Test and Validate

on:
  push:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Tests
        run: go test -v ./...

  test-browser:
    name: Test Active Browser JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Install pinned protocol compiler
        run: |
          curl --fail --location https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip --output "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: npm ci --prefix tools/browser-protocol --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Verify generated protocol artifacts
        run: node tools/browser-protocol/generate.cjs --check
      - run: node --test web/tests/*.test.cjs
