{{define "content"}}
<div style="max-width: 440px; margin: 40px auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <span class="logo-icon" style="width: 40px; height: 40px; font-size: 20px; margin: 0 auto 12px;">C</span>
      <h1 class="page-title" style="justify-content: center;">Initial Setup</h1>
      <p style="color: var(--text-muted); font-size: 13px;">Create your administrator account to get started.</p>
    </div>

    <form action="{{.PanelPath}}/first-time-setup" method="POST">
      <input type="hidden" name="token" value="{{.Token}}">

      <div class="form-group">
        <label class="form-label" for="username">Admin Username</label>
        <input type="text" id="username" name="username" class="form-input" required placeholder="admin" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Complete Setup</button>
    </form>
  </div>
</div>
{{end}}
