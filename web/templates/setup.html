{{define "content"}}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      {{template "logo_mark"}}
      <h1 class="auth-title">Set up CertainStats</h1>
      <p class="muted">Create the administrator account. You can add servers right after.</p>
    </div>

    <form class="card auth-form" action="{{.PanelPath}}/first-time-setup" method="POST" id="setup-form"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
      <input type="hidden" name="token" value="{{.Token}}">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        {{with .FieldErrors.username}}<p class="field-error" role="alert">{{.}}</p>{{end}}
        <input type="text" id="username" name="username" value="{{.Username}}" class="form-input" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        {{with .FieldErrors.password}}<p class="field-error" role="alert">{{.}}</p>{{end}}
        <input type="password" id="password" name="password" class="form-input" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
  </div>
</div>
<script src="{{.StaticPath}}/{{asset "auth/js/setup.js"}}" integrity="{{integrity "auth/js/setup.js"}}"></script>
{{end}}
