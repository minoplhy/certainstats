{{define "content"}}
<div style="max-width: 400px; margin: 60px auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <span class="logo-icon" style="width: 40px; height: 40px; font-size: 20px; margin: 0 auto 12px;">C</span>
      <h1 class="page-title" style="justify-content: center;">Sign In</h1>
      <p style="color: var(--text-muted); font-size: 13px;">Welcome back to CertainStats</p>
    </div>

    <form action="{{.PanelPath}}/login" method="POST">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input" required autofocus placeholder="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
    </form>
  </div>
</div>
{{end}}
