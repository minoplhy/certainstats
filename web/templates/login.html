{{define "content"}}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      {{template "logo_mark"}}
      <h1 class="auth-title">Sign in</h1>
      <p class="muted">Welcome back to CertainStats.</p>
    </div>

    <form class="card auth-form" action="{{.PanelPath}}/login" method="POST"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" value="{{.Username}}" class="form-input" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
      </div>

      <label class="checkbox-row" for="remember">
        <input type="checkbox" id="remember" name="remember" value="true">
        <span>Keep me signed in for 30 days</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</div>
{{end}}
