{{define "crowdsec_hero"}}
<section class="hero" aria-labelledby="cs-headline">
  <div class="hero-eyebrow">
    <span>CrowdSec</span><span aria-hidden="true">·</span><span data-cs-collector-count>Collectors</span>
  </div>
  <h1 class="hero-title" id="cs-headline" data-cs-headline>Loading alerts…</h1>
  <div class="hero-stats">
    <div class="hero-stat">
      <span class="hero-stat-label">Alerts</span>
      <span class="hero-stat-value"><span data-cs-stat-alerts>–</span></span>
    </div>
    <div class="hero-stat">
      <span class="hero-stat-label">Unique IPs</span>
      <span class="hero-stat-value"><span data-cs-stat-ips>–</span></span>
    </div>
    <div class="hero-stat">
      <span class="hero-stat-label">Active bans now</span>
      <span class="hero-stat-value"><span data-cs-stat-bans>–</span></span>
    </div>
    <div class="hero-stat">
      <span class="hero-stat-label">Collectors reporting</span>
      <span class="hero-stat-value"><span data-cs-stat-collectors>–</span></span>
    </div>
  </div>
  <div class="hero-actions">
    <button type="button" class="btn btn-secondary" data-cs-collectors>Collectors</button>
    <button type="button" class="btn btn-ghost" data-cs-refresh>Refresh</button>
  </div>
</section>

<div class="empty-state" data-cs-empty hidden>
  <h2 class="empty-state-title">Connect your first CrowdSec host</h2>
  <p>A collector on the server that runs CrowdSec's Local API sends its alerts here. Nothing changes in CrowdSec itself.</p>
  <button type="button" class="btn btn-primary" data-cs-add-collector>Add collector</button>
</div>
{{end}}
