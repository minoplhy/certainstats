{{define "knot_panels"}}
<section class="page-section kn-section" aria-labelledby="kn-traffic-title" data-kn-panels>
  <div class="kn-section-head">
    <h2 class="section-title" id="kn-traffic-title">Traffic</h2>
  </div>
  <article class="chart-card chart-card-wide">
    <div class="chart-header-row kn-card-head">
      <div class="kn-tabs" role="tablist" aria-label="Traffic by" data-kn-traffic-tabs>
        <button type="button" role="tab" aria-selected="true" data-kn-traffic-tab="protocol">Protocol</button>
        <button type="button" role="tab" aria-selected="false" data-kn-traffic-tab="rcode">Response codes</button>
        <button type="button" role="tab" aria-selected="false" data-kn-traffic-tab="qtype">Query types</button>
        <button type="button" role="tab" aria-selected="false" data-kn-traffic-tab="operation">Operations</button>
        <button type="button" role="tab" aria-selected="false" data-kn-traffic-tab="bytes">Bytes</button>
      </div>
      <div class="chart-legend-pills" data-kn-legend></div>
    </div>
    <p class="cs-status" role="status" aria-live="polite" data-kn-chart-message></p>
    <div class="chart-container">
      <canvas class="chart-canvas" id="kn-chart-traffic" role="img" aria-label="Traffic over time" data-kn-traffic-canvas></canvas>
    </div>
  </article>
</section>
{{end}}

{{define "knot_dnstap"}}
<section class="page-section kn-section kn-dnstap" aria-labelledby="kn-dnstap-title" data-kn-dnstap hidden>
  <div class="kn-section-head">
    <h2 class="section-title" id="kn-dnstap-title">Queries <span class="muted">from dnstap</span></h2>
    <span class="kn-note" data-kn-dnstap-note></span>
  </div>
  <div class="kn-dnstap-grid">
    <article class="chart-card">
      <div class="chart-header-row">
        <h3 class="chart-header-title">Matching queries</h3>
        <div class="chart-legend-pills"><span class="chart-legend-item"><span class="chart-legend-dot sw-s1" aria-hidden="true"></span>Queries <span class="chart-legend-val" data-kn-dnstap-total>–</span></span></div>
      </div>
      <p class="cs-status" role="status" aria-live="polite" data-kn-dnstap-message></p>
      <div class="chart-container">
        <canvas class="chart-canvas" id="kn-chart-dnstap" role="img" aria-label="Matching queries over time"></canvas>
      </div>
    </article>
    <article class="chart-card kn-top">
      <div class="kn-tabs kn-tabs-fill" role="tablist" aria-label="Top" data-kn-top-tabs></div>
      <p class="cs-status" role="status" aria-live="polite" data-kn-top-status></p>
      <ol class="cs-rank kn-top-list" data-kn-top-list></ol>
      <p class="kn-note" data-kn-top-foot></p>
    </article>
  </div>
</section>
{{end}}

{{define "knot_zones"}}
<section class="page-section kn-section kn-zones" aria-labelledby="kn-zones-title">
  <div class="kn-section-head">
    <h2 class="section-title" id="kn-zones-title">Zones <span class="muted mono" data-kn-zone-count></span></h2>
    <label class="toolbar-search kn-zone-search">
      <span class="sr-only">Search zones</span>
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search zones" autocomplete="off" data-kn-zone-search>
    </label>
  </div>
  <div class="kn-table" role="table" aria-label="Zones">
    <div class="kn-zones-head" role="row">
      <span role="columnheader">Zone</span><span role="columnheader">Servers</span><span role="columnheader">Serial</span>
      <span role="columnheader">Expires</span><span role="columnheader">Status</span>
    </div>
    <div data-kn-zone-list></div>
  </div>
  <p class="cs-status" role="status" aria-live="polite" data-kn-zones-message></p>
</section>
{{end}}
