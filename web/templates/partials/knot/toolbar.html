{{define "knot_toolbar"}}
<div class="toolbar-bar kn-toolbar">
  <label class="kn-field">
    <span class="kn-field-label">Server</span>
    <select class="form-select form-input-sm" data-kn-server>
      <option value="">All servers</option>
    </select>
  </label>
  <label class="kn-field">
    <span class="kn-field-label">Range</span>
    <select class="form-select form-input-sm" data-kn-range>
      <option value="1h">Last hour</option>
      <option value="6h">Last 6 hours</option>
      <option value="24h" selected>Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="90d">Last 90 days</option>
    </select>
  </label>
  <form class="kn-add-filter" data-kn-add-filter>
    <label class="kn-field">
      <span class="kn-field-label">Filter</span>
      <select class="form-select form-input-sm" data-kn-filter-field>
        <option value="zone">Zone</option>
        <option value="qname">Name</option>
        <option value="qtype">Query type</option>
        <option value="rcode">Response code</option>
      </select>
    </label>
    <label class="kn-field kn-field-grow">
      <span class="sr-only">Filter value</span>
      <input type="text" class="form-input form-input-sm" placeholder="e.g. example.com" maxlength="255" required autocomplete="off" data-kn-filter-value>
    </label>
    <button type="submit" class="btn btn-secondary btn-sm">Add</button>
  </form>
</div>
<div class="cs-chips" aria-label="Active filters" data-kn-chips></div>
<p class="banner is-warn" role="status" data-kn-source-note hidden></p>
{{end}}
