{{define "theme_bootstrap"}}<script>(function(){var p='system';try{p=localStorage.getItem('certainstats_theme')||'system';}catch(e){}var d=p==='dark'||(p!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.setAttribute('data-theme-pref',p);})();</script>{{end}}

{{define "logo_mark"}}<svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect class="logo-mark-bg" x="1.5" y="1.5" width="21" height="21" rx="6"/><path class="logo-mark-pulse" d="M5 14.5h3l2-5.5 3.2 8 2.3-4.5H19"/></svg>{{end}}

  <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
</button>{{end}}
