{{define "reinstall_modal"}}
<dialog id="reinstall-modal" class="modal modal-lg" aria-labelledby="reinstall-modal-title">
  <div class="modal-header">
    <h2 class="modal-title" id="reinstall-modal-title">Install instructions</h2>
    {{template "modal_close"}}
  </div>
  <div class="modal-body">
    <div id="reinstall-instructions-container"></div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-close-modal>Close</button>
  </div>
</dialog>
{{end}}
