{{define "reinstall_modal"}}
<!-- Reinstall & Installation Instructions Modal -->
<div id="reinstall-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 2000; backdrop-filter: blur(4px); overflow-y: auto; padding: 20px;">
  <div style="max-width: 620px; margin: 40px auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow-lg); animation: fadeIn 0.3s ease;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3 style="margin: 0; font-family: var(--font-display); font-size: 18px; color: var(--text-primary);" id="reinstall-modal-title">
        Installation Instructions
      </h3>
      <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('reinstall-modal').style.display='none'">✕</button>
    </div>

    <div id="reinstall-instructions-container" style="margin-bottom: 24px;"></div>

    <div style="display: flex; justify-content: flex-end;">
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('reinstall-modal').style.display='none'">Close</button>
    </div>
  </div>
</div>
{{end}}
