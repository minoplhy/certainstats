{{define "settings_password_form"}}
<section class="card">
  <h2 class="card-title card-title-spaced">Change password</h2>
  <form action="{{.PanelPath}}/settings/password" method="POST"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
    <div class="form-group">
      <label class="form-label" for="old_password">Current password</label>
      {{with .FieldErrors.old_password}}<p class="field-error" role="alert">{{.}}</p>{{end}}
      <input type="password" id="old_password" name="old_password" class="form-input" required autocomplete="current-password">
    </div>
    <div class="form-group">
      <label class="form-label" for="new_password">New password</label>
      {{with .FieldErrors.new_password}}<p class="field-error" role="alert">{{.}}</p>{{end}}
      <input type="password" id="new_password" name="new_password" class="form-input" required autocomplete="new-password">
    </div>
    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-input" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Update password</button>
  </form>
</section>
{{end}}
