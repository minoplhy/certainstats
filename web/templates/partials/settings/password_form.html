{{define "settings_password_form"}}
<!-- Password Change Form -->
<div class="card">
  <h3 style="font-family: var(--font-display); font-size: 16px; margin-bottom: 16px;">Change Password</h3>

  <form action="{{.PanelPath}}/settings/password" method="POST">
    <div class="form-group">
      <label class="form-label" for="old_password">Current Password</label>
      <input type="password" id="old_password" name="old_password" class="form-input" required placeholder="••••••••">
    </div>

    <div class="form-group">
      <label class="form-label" for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password" class="form-input" required placeholder="••••••••">
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-input" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
  </form>
</div>
{{end}}
