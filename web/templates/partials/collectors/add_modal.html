{{define "collectors_add_modal"}}
<dialog id="collectors-add-modal" class="modal" aria-labelledby="collectors-add-title" data-collectors-add-modal>
  <form data-collectors-form>
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="collectors-add-title">Add a collector</h2>
        <p class="modal-subtitle">You get a token and setup steps for the host next.</p>
      </div>
      {{template "modal_close"}}
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="collector-name">Name</label>
        <input type="text" id="collector-name" class="form-input" maxlength="64" required placeholder="e.g. edge-proxy" autocomplete="off" data-collectors-name>
      </div>
      <div class="form-group">
        <label class="form-label" for="collector-node">Node <span class="muted">(optional)</span></label>
        <select id="collector-node" class="form-select" data-collectors-node>
          <option value="">Not linked to a node</option>
          {{range .Nodes}}<option value="{{.AgentID}}">{{.Nickname}}</option>{{end}}
        </select>
        <p class="form-hint">Link it when the collector runs on a machine CertainStats already monitors.</p>
      </div>
      <fieldset class="form-fieldset">
        <legend class="form-label">What it collects</legend>
        <div class="collector-type-options" data-collectors-types></div>
      </fieldset>
      <p class="collector-status" role="alert" data-collectors-form-message></p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
      <button type="submit" class="btn btn-primary" data-collectors-create>Create collector</button>
    </div>
  </form>
</dialog>
{{end}}
