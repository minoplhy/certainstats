{{define "agents_list_view"}}
<div id="agents-list-container" class="table-responsive" hidden>
  <table class="table">
    <thead>
      <tr>
        <th>Node</th>
        <th>CPU</th>
        <th>Memory</th>
        <th>Network</th>
        <th>Driver</th>
        <th>Uptime</th>
      </tr>
    </thead>
    <tbody>
      {{range .Agents}}
      <tr class="agent-row-item" data-agent-id="{{.AgentID}}" data-agent-name="{{.Nickname}}" data-cpu-model="{{.CpuModel}}" onclick="handleAgentItemClick(event, '{{.AgentID}}');">
        <td>
          <a href="{{$.PanelPath}}/{{.AgentID}}" class="table-node">
            <span class="status-dot {{if .IsOnline}}online{{else}}offline{{end}}" id="td-dot-{{.AgentID}}"></span>
            <span class="table-node-text">
              <span class="table-node-name">{{.Nickname}}</span>
              <span class="table-node-sub">{{if .CpuModel}}{{.CpuModel}} · {{.CpuCores}} vCPU{{else}}Waiting for first report{{end}}</span>
            </span>
          </a>
        </td>
        <td>
          <div class="table-meter">
            <div class="usage-bar-track" id="td-track-cpu-{{.AgentID}}"><div class="usage-segment seg-cpu-usr" id="td-seg-cpu-{{.AgentID}}"></div></div>
            <span class="mono" id="td-cpu-{{.AgentID}}">–</span>
          </div>
        </td>
        <td>
          <div class="table-meter">
            <div class="usage-bar-track" id="td-track-ram-{{.AgentID}}"><div class="usage-segment seg-ram-used" id="td-seg-ram-{{.AgentID}}"></div></div>
            <span class="mono" id="td-ram-{{.AgentID}}">–</span>
          </div>
        </td>
        <td class="mono" id="td-net-{{.AgentID}}">–</td>
        <td class="mono">{{.AgentType}}</td>
        <td class="mono" id="td-uptime-{{.AgentID}}">{{formatUptime .Uptime}}</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
