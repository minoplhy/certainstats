{{define "agents_toolbar"}}
<div class="toolbar-bar">
  <label class="toolbar-search">
    <span class="sr-only">Search agents</span>
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="agent-search-input" placeholder="Search by name, CPU or ID" oninput="filterAgentsList()">
  </label>

  <div class="toolbar-group" role="group" aria-label="View">
    <button type="button" class="toolbar-btn active" id="btn-view-grid" onclick="setAgentViewMode('grid')">Cards</button>
    <button type="button" class="toolbar-btn" id="btn-view-list" onclick="setAgentViewMode('list')">Table</button>
  </div>

  <span class="toolbar-spacer"></span>

  <a href="{{.PanelPath}}/agents/management" class="btn btn-secondary">Manage agents</a>
  <button type="button" class="btn btn-primary" data-open-modal="add-agent-modal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Add agent
  </button>
</div>
{{end}}
