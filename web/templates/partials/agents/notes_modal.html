{{define "agents_notes_modal"}}
<dialog id="notes-modal" class="modal" aria-labelledby="notes-modal-title">
  <form id="notes-form" data-submit-action="save-notes"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="notes-modal-title">Private notes</h2>
        <p class="modal-subtitle">Only you can see these. Useful for provider, IP or access reminders.</p>
      </div>
      {{template "modal_close"}}
    </div>
    <div class="modal-body">
      <label class="sr-only" for="notes-textarea">Notes</label>
      <textarea id="notes-textarea" class="form-textarea mono" rows="7" placeholder="Hosted at…">{{if .Agent}}{{.Agent.Note}}{{end}}</textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
      <button type="button" id="save-notes-btn" class="btn btn-primary">Save notes</button>
    </div>
  </form>
</dialog>
{{end}}
