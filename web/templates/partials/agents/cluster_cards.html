{{define "agents_cluster_cards"}}
<!-- 4 Dual-Metric Cluster Cards (Total Telemetry Panel) -->
<div class="total-telemetry-panel">
  <!-- Card 1: TOTAL BANDWIDTH -->
  <div class="telemetry-card">
    <div class="telemetry-card-header">
      <span class="telemetry-card-title">TOTAL BANDWIDTH</span>
      <span class="telemetry-card-icon" style="color: var(--accent-primary);">⇅</span>
    </div>
    <div class="telemetry-card-body">
      <div class="telemetry-col">
        <div class="telemetry-col-label">Download</div>
        <div class="telemetry-num-val" id="admin-live-rx-val">↓ 0 B/s</div>
      </div>
      <div class="telemetry-divider"></div>
      <div class="telemetry-col">
        <div class="telemetry-col-label">Upload</div>
        <div class="telemetry-num-val" id="admin-live-tx-val">↑ 0 B/s</div>
      </div>
    </div>
    <div class="telemetry-bottom-line" style="background: linear-gradient(90deg, var(--accent-primary), transparent);"></div>
  </div>

  <!-- Card 2: TOTAL DISK I/O -->
  <div class="telemetry-card">
    <div class="telemetry-card-header">
      <span class="telemetry-card-title">TOTAL DISK I/O</span>
      <span class="telemetry-card-icon" style="color: #fb923c;">⛁</span>
    </div>
    <div class="telemetry-card-body">
      <div class="telemetry-col">
        <div class="telemetry-col-label">Read</div>
        <div class="telemetry-num-val" id="admin-live-disk-read-val">0 B/s</div>
      </div>
      <div class="telemetry-divider"></div>
      <div class="telemetry-col">
        <div class="telemetry-col-label">Write</div>
        <div class="telemetry-num-val" id="admin-live-disk-write-val">0 B/s</div>
      </div>
    </div>
    <div class="telemetry-bottom-line" style="background: linear-gradient(90deg, #fb923c, transparent);"></div>
  </div>

  <!-- Card 3: TOTAL TRAFFIC -->
  <div class="telemetry-card">
    <div class="telemetry-card-header">
      <span class="telemetry-card-title">TOTAL TRAFFIC</span>
      <span class="telemetry-card-icon" style="color: #14b8a6;">☁</span>
    </div>
    <div class="telemetry-card-body">
      <div class="telemetry-col">
        <div class="telemetry-col-label">Received</div>
        <div class="telemetry-num-val" id="admin-total-rx-val">↓ 0 B</div>
      </div>
      <div class="telemetry-divider"></div>
      <div class="telemetry-col">
        <div class="telemetry-col-label">Sent</div>
        <div class="telemetry-num-val" id="admin-total-tx-val">↑ 0 B</div>
      </div>
    </div>
    <div class="telemetry-bottom-line" style="background: linear-gradient(90deg, #14b8a6, transparent);"></div>
  </div>

  <!-- Card 4: TOTAL DISK READ/WRITE -->
  <div class="telemetry-card">
    <div class="telemetry-card-header">
      <span class="telemetry-card-title">TOTAL DISK READ/WRITE</span>
      <span class="telemetry-card-icon" style="color: #ef4444;">⛁</span>
    </div>
    <div class="telemetry-card-body">
      <div class="telemetry-col">
        <div class="telemetry-col-label">Read Vol</div>
        <div class="telemetry-num-val" id="admin-total-disk-read-val">0 B</div>
      </div>
      <div class="telemetry-divider"></div>
      <div class="telemetry-col">
        <div class="telemetry-col-label">Write Vol</div>
        <div class="telemetry-num-val" id="admin-total-disk-write-val">0 B</div>
      </div>
    </div>
    <div class="telemetry-bottom-line" style="background: linear-gradient(90deg, #ef4444, transparent);"></div>
  </div>
</div>
{{end}}
