{{define "agents_cluster_cards"}}
<div class="hero-stats">
  <div class="hero-stat">
    <span class="hero-stat-label">Bandwidth now</span>
    <span class="hero-stat-value"><span id="admin-live-rx-val">↓ 0 B/s</span><span id="admin-live-tx-val">↑ 0 B/s</span></span>
  </div>
  <div class="hero-stat">
    <span class="hero-stat-label">Disk I/O now</span>
    <span class="hero-stat-value"><span>R <span id="admin-live-disk-read-val">0 B/s</span></span><span>W <span id="admin-live-disk-write-val">0 B/s</span></span></span>
  </div>
  <div class="hero-stat">
    <span class="hero-stat-label">Traffic, all time</span>
    <span class="hero-stat-value"><span id="admin-total-rx-val">↓ 0 B</span><span id="admin-total-tx-val">↑ 0 B</span></span>
  </div>
  <div class="hero-stat">
    <span class="hero-stat-label">Disk, all time</span>
    <span class="hero-stat-value"><span>R <span id="admin-total-disk-read-val">0 B</span></span><span>W <span id="admin-total-disk-write-val">0 B</span></span></span>
  </div>
</div>
{{end}}
