{{define "alerts_history_table"}}
<section id="history-section" class="page-section">
  <div class="section-header">
    <h2 class="section-title">Incident history</h2>
    <div class="page-actions">
      <label class="sr-only" for="history-search">Search incidents</label>
      <input type="search" id="history-search" class="form-input form-input-sm" placeholder="Search incidents">
      <div class="toolbar-group" role="group" aria-label="Filter by status">
        <button type="button" class="toolbar-btn history-filter-btn active" data-status="all">All</button>
        <button type="button" class="toolbar-btn history-filter-btn" data-status="firing">Firing</button>
        <button type="button" class="toolbar-btn history-filter-btn" data-status="resolved">Resolved</button>
      </div>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table" id="history-table">
      <thead>
        <tr>
          <th>Started</th>
          <th>Rule and server</th>
          <th>Value</th>
          <th>Duration</th>
          <th>Status</th>
          <th>Notification</th>
        </tr>
      </thead>
      <tbody id="history-tbody">
        <tr><td colspan="6" class="table-empty">Loading incident history…</td></tr>
      </tbody>
    </table>
  </div>
</section>
{{end}}
