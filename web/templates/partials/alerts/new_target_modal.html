{{define "alerts_new_target_modal"}}
<!-- New Target Modal -->
<dialog id="new-target-modal" class="modal" aria-labelledby="new-target-modal-title">
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="new-target-modal-title">New notification target</h2>
        <p class="modal-subtitle">Save a webhook you can reuse across alert rules.</p>
      </div>
      {{template "modal_close"}}
    </div>

    <form action="{{.PanelPath}}/alerts/targets/create" method="POST"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
      <div class="modal-body">
      <div class="form-group">
        <label class="form-label" for="create-tgt-name">Name</label>
        <input type="text" id="create-tgt-name" name="name" class="form-input" required placeholder="e.g. Ops channel">
      </div>

      <div class="form-group">
        <label class="form-label" for="create-tgt-type">Send to</label>
        <select id="create-tgt-type" name="type" class="form-select">
          <option value="discord">Discord webhook</option>
          <option value="webhook">HTTP POST webhook</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="create-tgt-destination">Webhook URL</label>
        <input type="url" id="create-tgt-destination" name="destination" class="form-input" required placeholder="https://discord.com/api/webhooks/...">
      </div>

      <div class="form-group">
        <div class="label-row">
          <label class="form-label" for="create-tgt-payload">Default message template <span class="muted">(optional JSON)</span></label>
          <button type="button" class="btn btn-secondary btn-sm" data-open-modal="template-guide-modal">Template variables</button>
        </div>
        <textarea id="create-tgt-payload" name="payload" class="form-textarea mono" placeholder='Enter custom JSON payload template...'></textarea>
      </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal="new-target-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save target</button>
      </div>
    </form>
</dialog>
{{end}}
