{{define "alerts_edit_target_modal"}}
<!-- Edit Target Modal -->
<dialog id="edit-target-modal" class="modal" aria-labelledby="edit-target-modal-title">
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="edit-target-modal-title">Edit notification target</h2>
        <p class="modal-subtitle">Change where notifications are sent and the default message.</p>
      </div>
      {{template "modal_close"}}
    </div>

    <form action="{{.PanelPath}}/alerts/targets/edit" method="POST">
      <div class="modal-body">
      <input type="hidden" id="edit-target-id-input" name="id" value="">

      <div class="form-group">
        <label class="form-label" for="edit-target-name">Name</label>
        <input type="text" id="edit-target-name" name="name" class="form-input" required placeholder="e.g. Discord Ops Channel, PagerDuty Webhook">
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-target-type">Send to</label>
        <select id="edit-target-type" name="type" class="form-select">
          <option value="discord">Discord webhook</option>
          <option value="webhook">HTTP POST webhook</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-target-destination">Webhook URL</label>
        <input type="url" id="edit-target-destination" name="destination" class="form-input" required placeholder="https://discord.com/api/webhooks/...">
      </div>

      <div class="form-group">
        <div class="label-row">
          <label class="form-label" for="edit-target-payload">Default message template <span class="muted">(optional JSON)</span></label>
          <button type="button" class="btn btn-secondary btn-sm" data-open-modal="template-guide-modal">Template variables</button>
        </div>
        <textarea id="edit-target-payload" name="payload" class="form-textarea mono" placeholder='Enter custom JSON payload template...'></textarea>
      </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal="edit-target-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save target</button>
      </div>
    </form>
</dialog>
{{end}}
