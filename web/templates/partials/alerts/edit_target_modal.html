{{define "alerts_edit_target_modal"}}
<!-- Edit Target Modal -->
<div id="edit-target-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; backdrop-filter: blur(4px); overflow-y: auto; padding: 20px 10px;">
  <div style="max-width: 540px; margin: 60px auto; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow-lg);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
      <div>
        <h3 style="margin: 0; font-family: var(--font-display); font-size: 18px;">Edit Notification Target</h3>
        <p style="margin: 4px 0 0 0; font-size: 12px; color: var(--text-muted);">Update destination webhook URL and default template.</p>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('edit-target-modal').style.display='none'">✕</button>
    </div>

    <form action="{{.PanelPath}}/alerts/targets/edit" method="POST">
      <input type="hidden" id="edit-target-id-input" name="id" value="">

      <div class="form-group">
        <label class="form-label" for="edit-target-name">Target Preset Name</label>
        <input type="text" id="edit-target-name" name="name" class="form-input" required placeholder="e.g. Discord Ops Channel, PagerDuty Webhook">
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-target-type">Channel Type</label>
        <select id="edit-target-type" name="type" class="form-select">
          <option value="discord">Discord Webhook</option>
          <option value="webhook">Generic HTTP POST Webhook</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-target-destination">Destination Webhook URL</label>
        <input type="url" id="edit-target-destination" name="destination" class="form-input" required placeholder="https://discord.com/api/webhooks/...">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label class="form-label" for="edit-target-payload" style="margin-bottom: 0;">Default Payload Template (Optional JSON)</label>
          <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('template-guide-modal').style.display='block'" style="font-size: 10px; padding: 2px 6px;">Variables Guide</button>
        </div>
        <textarea id="edit-target-payload" name="payload" class="form-input mono" style="min-height: 80px; font-size: 12px;" placeholder='Enter custom JSON payload template...'></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('edit-target-modal').style.display='none'">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Target</button>
      </div>
    </form>
  </div>
</div>
{{end}}
