{{define "content"}}
<section class="hero">
  <div class="hero-eyebrow"><span>Settings</span></div>
  <h1 class="hero-title">Account and sessions</h1>
  <p class="page-subtitle">Change your password and sign out devices you don't recognize.</p>
</section>

<div class="settings-grid">
  {{template "settings_password_form" .}}
  {{template "settings_sessions_table" .}}
</div>

<script src="{{.StaticPath}}/{{asset "js/admin_modals.js"}}" integrity="{{integrity "js/admin_modals.js"}}"></script>
<script type="application/json" id="page-config" data-module="CertainStatsAdminModals">{{bootstrap .}}</script>
<script src="{{.StaticPath}}/{{asset "js/bootstrap.js"}}" integrity="{{integrity "js/bootstrap.js"}}"></script>
{{end}}
