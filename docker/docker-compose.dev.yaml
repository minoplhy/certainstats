services:
  certainstats:
    image: ghcr.io/minoplhy/certainstats:dev
    container_name: certainstats-dev
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/app/data
    environment:
      - WS_PROTOBUF=${WS_PROTOBUF:-false}
      # Use either PANEL_URL (+ optional PUBLIC_URL) or the *_PATH pair, not both.
      - PANEL_URL=${PANEL_URL:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - PANEL_PATH=${PANEL_PATH:-}
      - PUBLIC_PATH=${PUBLIC_PATH:-}
      - DATA_DIR=/app/data
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - PORT=${PORT:-8080}
      - DEBUG=true
    restart: unless-stopped
